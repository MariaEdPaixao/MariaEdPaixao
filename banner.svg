<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8839D3"/>
      <stop offset="1" stop-color="#FF37A9"/>
    </linearGradient>
    <style>
      .name{font:800 56px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#fff;animation:up 1.1s ease-out both}
      .desc{font:500 22px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#fff;letter-spacing:1.5px;opacity:.92;animation:up 1.1s .35s ease-out both}
      .wave{animation:drift 7s ease-in-out infinite alternate}
      @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-90px)}}
    </style>
  </defs>
  <path class="wave" fill="url(#g)" opacity=".35" d="M0 0H1300V215C1170 255 1040 180 900 205C760 230 640 260 500 225C360 190 220 250 0 230Z"/>
  <path fill="url(#g)" d="M0 0H1200V195C1040 245 880 165 720 200C560 235 420 250 260 215C160 193 80 205 0 215Z"/>
  <text class="name" x="600" y="108" text-anchor="middle">Maria Eduarda Paixão</text>
  <text class="desc" x="600" y="152" text-anchor="middle">Software Developer · Backend &amp; Full Stack</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
